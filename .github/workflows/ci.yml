name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Verify repository legal files
        run: python scripts/verify.py

      - name: Validate committed metadata and governance
        run: python scripts/ci_check.py
