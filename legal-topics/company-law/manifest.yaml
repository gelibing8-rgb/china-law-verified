# 公司法专题 manifest（V3 样板）
# ----------------------------------------------------------------------------
# 数据来源（已用）：
#   - flk.npc.gov.cn（国家法律法规数据库）官方 API  元数据核验
#   - just-laws (ImCa0/just-laws, MIT) 本地只读      CANDIDATE 正文本体的唯一来源
#   - web_search（MiniMax Search）                   仅取 source_url + 元数据
# 数据未获取（原因）：
#   - flk.npc.gov.cn 的 WPS/OFD 文档 viewer 受内网物理阻塞，正文无法在公网下载
#   - court.gov.cn / moj.gov.cn / gov.cn / npc.gov.cn 在本环境 TLS 握手被服务端拒绝
#   - 不绕过、不重试、不批量访问
#
# 字段定义（per V3 spec）：
#   document_id         专题内部唯一 ID
#   title               标题（不包含推断的修辞，仅原文标题）
#   document_type       法律 / 行政法规 / 部门规章 / 规范性文件 / 司法解释 / 案例
#   relation_type       primary_law / administrative_regulation / department_rule /
#                       normative_document / judicial_interpretation / guiding_case /
#                       people_court_case / typical_case / gazette_case / historical_version
#   status              现行 / 已被修正 / 已废止 / 已失效（案例用其发布机构口径）
#   issuing_authority   制定 / 发布机关
#   effective_date      现行版本施行日期（YYYY-MM-DD）
#   source_url          官方源 / 公开发布 URL
#   verification_status VERIFIED / OFFICIAL_META / CANDIDATE
#   local_path          本地已存在的文件路径；无则 null
# ----------------------------------------------------------------------------
